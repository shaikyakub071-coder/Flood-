<!-- VOICE ASSISTANT WIDGET (Web Speech API) -->
<div id="voice-box"
     class="voice-box"
     data-lang="{{ lang }}"
     data-url="/api/voice"
     data-auto-submit="1"
     data-msg-unsupported="{{ t('voice_unsupported') }}"
     data-msg-no-voice="{{ t('voice_no_voice') }}"
     data-msg-pick-start="{{ t('voice_pick_start') }}"
     data-msg-loading="{{ t('voice_loading') }}"
     data-msg-offline="{{ t('voice_offline') }}"
     data-msg-no-listen="{{ t('voice_no_listen') }}"
     data-msg-listening="{{ t('voice_listening') }}"
     data-msg-not-found="{{ t('voice_not_found') }}"
     data-msg-heard="{{ t('voice_heard') }}"
     data-msg-mic-denied="{{ t('voice_mic_denied') }}"
     style="margin-top:20px;padding:18px 22px;background:linear-gradient(135deg, rgba(15,23,42,0.95), rgba(30,41,59,0.85));border-radius:14px;border:1px solid rgba(56,189,248,0.35);box-shadow:0 8px 24px -6px rgba(14,165,233,0.25);">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px;">
        <div style="display:flex;align-items:center;gap:14px;">
            <div style="position:relative;">
                <div style="width:48px;height:48px;background:linear-gradient(135deg, #0284c7, #0369a1);display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:24px;box-shadow:0 0 15px rgba(56,189,248,0.4);">
                    🎙️
                </div>
                <div id="voiceWave" style="display:none;position:absolute;-top:4px;-right:4px;width:12px;height:12px;background:#22c55e;border-radius:50%;box-shadow:0 0 8px #22c55e;"></div>
            </div>
            <div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <strong style="color:#e0f2fe;font-size:16px;letter-spacing:-0.2px;">AI Emergency Voice Assistant</strong>
                    <span style="background:rgba(56,189,248,0.15);color:#38bdf8;border:1px solid rgba(56,189,248,0.3);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;">
                        EN · TE · HI
                    </span>
                </div>
                <div style="font-size:13px;color:#94a3b8;margin-top:3px;">
                    💡 {{ t('voice_hint') }}
                </div>
            </div>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
            <button type="button" id="voice-listen" class="search-btn"
                    style="background:linear-gradient(135deg, #0284c7, #0369a1);padding:10px 18px;font-size:14px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(2,132,199,0.35);transition:all 0.2s ease;">
                <span>🎤</span> <span>{{ t('voice_listen') }}</span>
            </button>
            <button type="button" id="voice-speak" class="search-btn"
                    style="background:linear-gradient(135deg, #059669, #047857);padding:10px 18px;font-size:14px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(5,150,105,0.35);transition:all 0.2s ease;">
                <span>🔊</span> <span>{{ t('voice_speak') }}</span>
            </button>
            <button type="button" id="voice-stop" class="search-btn"
                    style="background:#334155;padding:10px 14px;font-size:14px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;transition:all 0.2s ease;">
                <span>⏹</span> <span>{{ t('voice_stop') }}</span>
            </button>
        </div>
    </div>
    <div id="voice-status" style="margin-top:12px;font-size:13px;font-weight:600;color:#38bdf8;min-height:20px;display:flex;align-items:center;gap:8px;"></div>
</div>
