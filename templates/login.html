<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif;
               background: #0f172a; color: white;
               display: flex; justify-content: center; padding-top: 80px; }
        form { background: #1e293b; padding: 30px; border-radius: 12px;
               width: 320px; max-width: 92%; }
        h2 { color: #38bdf8; margin-top: 0; }
        input, button { width: 100%; padding: 12px; margin-top: 12px;
                        border-radius: 7px; border: 1px solid #475569;
                        font-size: 15px; }
        input { background: #0f172a; color: white; }
        button { background: #0284c7; color: white; font-weight: bold;
                 border: none; cursor: pointer; }
        button:hover { background: #0369a1; }
        .err { color: #fecaca; margin-top: 12px; }
        a { color: #38bdf8; text-decoration: none; display: block;
            margin-top: 15px; text-align: center; }
    </style>
</head>
<body>
    <form method="POST">
        <h2>🔒 Admin Login</h2>
        <input type="password" name="password" placeholder="Password"
               required autofocus>
        <button type="submit">Login</button>
        {% if error %}<div class="err">❌ {{ error }}</div>{% endif %}
        <a href="/">← Back to Route Planner</a>
    </form>
</body>
</html>
